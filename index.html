<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Dashboard Interactivo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>To-Do Dashboard</h1>
    <button id="modoBtn">🌙 Modo oscuro</button>
  </header>

  <main>
    <section id="form-section">
      <h2>Agregar Tarea</h2>
      <form id="tareaForm">
        <input type="text" id="nueva-tarea" placeholder="Nueva Tarea" required>
        <button type="submit">Agregar</button>
      </form>
    </section>

    <section id="stats-section">
      <h2>Tareas</h2>
      <p><strong>Total de tareas:</strong> <span id="total">0</span></p>
      <button id="borrarTodo">🗑️ Borrar Tarea</button>
      <button id="completa">✅</button>
      <ul id="listaTareas"></ul>
    </section>
  </main>

  <footer>
    Hecho por Xavi Contreras © 2025
  </footer>
</body>
</html>
