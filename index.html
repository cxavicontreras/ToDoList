<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Aplicación web para crear, completar y administrar tareas."
  >

  <title>Lista de tareas | Xavier Contreras</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>To-Do Dashboard</h1>

    <!-- Solo debe existir un botón -->
    <button id="modoBtn" type="button">
      ☀️ Modo claro
    </button>
  </header>

  <main>
    <section id="form-section">
      <h2>Agregar tarea</h2>

      <form id="tareaForm">
        <input
          type="text"
          id="nueva-tarea"
          placeholder="Nueva tarea"
          required
        >

        <button type="submit">Agregar</button>
      </form>
    </section>

    <section id="stats-section">
      <h2>Tareas</h2>

      <p>
        <strong>Total de tareas:</strong>
        <span id="total">0</span>
      </p>

      <button id="borrarTodo" type="button">
        🗑️ Borrar todas
      </button>

      <ul id="listaTareas"></ul>
    </section>
  </main>

  <footer>
    Hecho por Xavier Contreras © 2025
  </footer>
</body>
</html>
